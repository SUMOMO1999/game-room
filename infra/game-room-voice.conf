# Optional approved self-hosted microphone-only media child.
# Does not replace the original service, store key or identity credentials.
[Service]
LoadCredential=voice-key:/etc/game-room/voice-key.json
KillMode=control-group
# Go/Pion enumerates local interfaces through rtnetlink; keep AF_PACKET denied.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
