<!doctype html>
<html lang="zh-CN" class="army-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#143b30">
  <meta name="description" content="翻棋军棋单人练习，与自动对手慢慢下；本机保存，不计战绩。">
  <title>军棋练习 · 棋牌室</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./army.css">
  <link rel="stylesheet" href="./app-shell.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="棋牌室">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script type="module" src="./army-practice.mjs"></script>
  <script type="module" src="./platform/practice-navigation.mjs"></script>
  <script type="module" src="./app-shell.mjs"></script>
  <style>
    .army-practice-screen #exit-practice { display:inline-flex; align-items:center; justify-content:center; flex:none; border:1px solid #d7c48d66; text-decoration:none; color:#f4e7c7; white-space:nowrap; }
    .army-practice-screen #practice-save-note { flex:none; color:#becdb6; font-size:10px; line-height:1.4; margin:0; text-align:center; }
    .army-practice-screen .army-action-bar { align-items:center; }
    .army-practice-screen .player-seat > span { margin-top:0; }
    .army-practice-screen .army-side { flex:none; white-space:nowrap; }
    .army-practice-screen #army-round { white-space:nowrap; }
    .army-practice-screen .army-heading h1 { letter-spacing:1px; }
    .army-practice-screen .army-dialog #army-rule-page { overflow:auto; min-height:0; }
    @media (max-height:420px) { .army-practice-screen #practice-save-note { font-size:9px; } }
  </style>
  <link rel="stylesheet" href="./platform/room-settings.css">
  <script type="module" src="./platform/room-settings.mjs"></script>
</head>
<body data-mode="army-practice" class="army-screen army-practice-screen in-game">
  <div class="shell">
    <header class="site-header room-header">
      <a class="brand" href="./" data-practice-exit aria-label="棋牌室首页"><span class="brand-mark" aria-hidden="true"><i>3</i><i>3</i></span><strong>棋牌室</strong></a>
      <div class="header-actions room-toolbar">
        <span class="mode-badge room-toolbar-status" id="practice-mode">单人练习 · 不计战绩</span>
        <div class="room-toolbar-actions">
          <button id="game-settings-toggle" class="quiet-button game-settings-toggle room-toolbar-action" type="button" data-room-settings data-settings-dialog="game-settings-dialog" data-settings-close="game-settings-close" aria-controls="game-settings-dialog" aria-haspopup="dialog" aria-expanded="false">设置</button>
          <button id="sound-toggle" data-settings-target="game-settings-audio" class="sound-toggle" type="button" aria-pressed="false" aria-label="开启音效">音效关</button>
          <button id="show-rules" data-settings-target="game-settings-help" data-settings-dismiss class="quiet-button" type="button">规则</button>
          <button id="restart" data-settings-target="game-settings-practice" data-settings-dismiss class="quiet-button" type="button">重新开始</button>
          <a id="exit-practice" data-practice-exit class="quiet-button room-toolbar-action room-toolbar-exit" href="./" aria-label="退出练习，返回大厅">← 返回大厅</a>
        </div>
      </div>
    </header>
    <main>
      <div id="room-players" class="room-players" aria-label="练习双方"></div>
      <div id="room-play">
        <div class="army-heading"><h1>军棋练习</h1><span id="army-round">第 1 回合</span><strong id="army-turn">翻子分色</strong></div>
        <section class="army-table" aria-label="军棋练习棋盘">
          <div id="army-board-stage" class="army-board-stage"><div id="army-board" class="army-board" aria-label="完整军棋棋盘"><svg id="army-lines" viewBox="0 0 1200 500" aria-hidden="true"></svg><div id="army-cells" class="army-cells"></div></div></div>
        </section>
        <div class="army-action-bar"><p id="army-feedback" role="status" aria-live="polite"></p><div class="army-action-buttons"><button id="army-cancel" class="secondary-button" type="button" disabled>取消选子</button><button id="army-captured" class="secondary-button" type="button">阵亡棋子</button></div></div>
      </div>
      <p id="practice-save-note">与自动对手练习 · 不计战绩 · 进度只保存在这个浏览器</p>
      <section id="room-result" class="room-result" aria-labelledby="result-title" hidden><h2 id="result-title"></h2><p id="result-reason"></p><p>这是单人练习，不计战绩。</p><div class="confirm-actions"><button id="result-close" class="secondary-button" type="button">看看棋盘</button><button id="result-restart" class="primary-button" type="button">再练一局 →</button></div></section>
    </main>
  </div>
  <dialog id="rules-dialog" class="army-dialog army-rules-dialog" aria-labelledby="rules-title">
    <div class="dialog-heading"><h2 id="rules-title">翻棋军棋练习</h2><button id="close-rules" class="close-button" type="button" aria-label="关闭规则">×</button></div>
    <p id="army-assignment-rule"></p><div id="army-rule-page"></div>
    <div class="army-rule-pages"><button id="army-rules-prev" class="secondary-button" type="button">上一页</button><span id="army-rules-page"></span><button id="army-rules-next" class="secondary-button" type="button">下一页</button></div>
    <div class="sound-settings" id="sound-settings" data-settings-target="game-settings-audio"><label for="sound-volume">音效音量</label><input id="sound-volume" type="range" min="0" max="100" step="5" value="45" aria-label="音效音量"><select id="sound-preview-kind" aria-label="选择试听音效"><option value="flip">翻棋</option><option value="move">走棋</option><option value="collision">碰撞</option><option value="select">选牌</option><option value="undo">撤销</option><option value="invalid">操作失败</option><option value="start">开局</option><option value="turn">轮到你</option><option value="win">获胜</option><option value="loss">落败</option><option value="draw-result">和局</option></select><button id="sound-preview" class="secondary-button" type="button">试听</button><span id="sound-preview-status" role="status" aria-live="polite">45%</span></div>
    <p>自动对手也只看已翻开的棋子。本机保存，与朋友房间及账号战绩无关。</p>
    <button id="start-playing" class="primary-button" type="button">明白了，继续练习</button>
  </dialog>
  <dialog id="restart-dialog" class="army-dialog confirm-dialog" aria-labelledby="restart-title">
    <div class="dialog-heading"><h2 id="restart-title">重新开始军棋练习？</h2><button id="close-restart" class="close-button" type="button" aria-label="取消重新开始">×</button></div>
    <p>当前练习进度会清空，重新随机扣棋和选择先手。返回大厅会保留这局，可以稍后继续。</p>
    <div class="confirm-actions"><button id="cancel-restart" class="secondary-button" type="button">继续这局</button><button id="confirm-restart" class="primary-button" type="button">重新开始</button></div>
  </dialog>
  <dialog id="army-captured-dialog" class="army-dialog" aria-labelledby="army-captured-title"><div class="dialog-heading"><h2 id="army-captured-title">已阵亡棋子</h2><button id="army-captured-close" class="close-button" type="button" aria-label="收起阵亡棋子">×</button></div><div id="army-captured-list" class="army-captured-list"></div><p>对方三枚地雷全部移除后，才可以攻击已翻开的军旗。</p></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">请开启浏览器的 JavaScript 后进入练习。</p></noscript>
<dialog id="game-settings-dialog" class="game-settings-dialog" aria-labelledby="game-settings-title"><div class="dialog-heading"><h2 id="game-settings-title">设置</h2><button id="game-settings-close" class="close-button" type="button" aria-label="收起设置">×</button></div><div class="game-settings-body"><section><h3>音效</h3><div id="game-settings-audio" class="game-settings-controls"></div></section><section><h3>玩法</h3><div id="game-settings-help" class="game-settings-controls"></div></section><section><h3>练习</h3><div id="game-settings-practice" class="game-settings-controls"></div></section></div></dialog>
</body>
</html>
