<body data-appearance-scope="lobby" data-compact-shell data-lobby-auth="checking"><div class="shell lobby-shell"><header class="site-header"><a class="brand" href="./" aria-label="棋牌室首页"><span class="brand-mark" aria-hidden="true"><i>3</i><i>3</i></span><strong>棋牌室</strong></a><nav class="lobby-navigation" aria-label="大厅导航"><a class="practice-hub-link" href="./practice-hub.html">练习大厅 <span aria-hidden="true">↗</span></a><details class="shell-more"><summary aria-label="更多选项">更多 <span aria-hidden="true">⋯</span></summary><div class="shell-more-menu" data-app-shell-menu><button id="account-logout" class="text-button" hidden>退出棋牌室</button></div></details></nav></header>
<main><section id="account-panel" class="account-panel lobby-welcome" aria-live="polite"><div class="welcome-identity"><h1 id="account-heading">来一局。</h1><p id="account-description">正在载入大厅…</p></div><div class="account-actions"><details id="lobby-name-field" class="nickname-editor" hidden><summary>改称呼</summary><div><label for="create-name">这局使用的昵称</label><input id="create-name" form="create-form" name="name" maxlength="16" placeholder="你的昵称" autocomplete="nickname" required></div></details><a id="account-login" class="secondary-button" hidden>登录后开一局 →</a><button id="account-retry" class="secondary-button" hidden>重新连接</button><a id="account-reauth" class="quiet-link account-reauth-link" href="https://agora.sumomoli.com/#account" target="_blank" rel="noopener" hidden>重新验证账号 ↗</a></div></section>
<section id="recent-section" class="recent-section" hidden><h2>接着上一局</h2><p id="recent-description">恢复你之前加入的房间。</p><div id="recent-list"></div></section>

<div class="lobby-loading-games" aria-hidden="true"><div class="lobby-loading-heading"></div><div class="lobby-games"><span class="lobby-loading-card"><i></i><b></b></span><span class="lobby-loading-card"><i></i><b></b></span><span class="lobby-loading-card"><i></i><b></b></span><span class="lobby-loading-card"><i></i><b></b></span><span class="lobby-loading-card"><i></i><b></b></span><span class="lobby-loading-card"><i></i><b></b></span><span class="lobby-loading-card"><i></i><b></b></span></div></div>

<div class="lobby-loading-join" aria-hidden="true"><b></b><span></span><i></i><span></span><i></i><i></i></div>
</section>
<div id="lobby-workspace" class="lobby-workspace" hidden><section class="lobby-game-picker" aria-labelledby="game-picker-title"><div class="game-picker-heading"><h2 id="game-picker-title">今天玩什么？</h2><a id="selected-practice" class="quiet-link" href="./practice.html">先练一局 ↗</a></div><div id="lobby-games" class="lobby-games" role="group" aria-label="选择游戏"></div></section><div class="lobby-forms" id="lobby-forms" hidden><section class="room-card create-card"><h2>开一局</h2><p id="create-game-description">拉密 · 2～7 人 · 每人回合 30 分钟</p><form id="create-form"><label for="create-game" class="selection-fallback">这一局玩什么？</label><select id="create-game" class="selection-fallback" name="gameType"><option value="rummikub">拉密 · 2～7 人</option><option value="army-flip">翻棋军棋 · 2 人</option></select><fieldset id="create-parks-settings" class="parks-create-settings" hidden><legend>本局玩法</legend><div class="parks-config-field"><label for="create-parks-mode">玩法</label><select id="create-parks-mode"><option value="standard">朋友徒步 · 2～5人</option><option value="teddy">Teddy同行 · 2人</option><option value="solo">单人挑战 · 1人</option></select></div><div class="parks-config-field"><span class="parks-config-label">露营</span><label class="parks-create-camping"><input id="create-parks-camping" type="checkbox">加入露营</label></div><div class="parks-config-field"><label for="create-parks-volunteers">志愿挑战</label><select id="create-parks-volunteers"><option value="0">不加入挑战</option><option value="1">入门 · 1个项目</option><option value="2">进阶 · 2个项目</option><option value="3">高级 · 3个项目</option><option value="4">极限 · 4个项目</option></select></div><div class="parks-config-field"><label for="create-parks-passion">起始热忱</label><select id="create-parks-passion"><option value="random">随机热忱</option><option value="choose">二选一热忱</option></select></div></fieldset><button type="submit" class="primary-button">创建房间 <span aria-hidden="true">→</span></button></form></section>
<section class="room-card join-card"><h2>朋友在等你？</h2><p>输入房间号，直接入座。</p><form id="join-form"><div class="join-fields"><input id="join-name" type="hidden" name="name"><div><label for="join-code">房间号</label><input id="join-code" name="code" maxlength="6" minlength="6" placeholder="六位房间号" autocomplete="off" spellcheck="false" required></div></div><label for="join-role">参与方式</label><select id="join-role" name="role"><option value="player">加入牌局（已开局自动观战）</option><option value="spectator">观战</option></select><button type="submit" class="secondary-button">加入房间 <span aria-hidden="true">→</span></button></form></section></div></div>
